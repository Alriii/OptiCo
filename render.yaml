services:
  - type: web
    name: optico-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://opti-co.vercel.app
      - key: FRONTEND_ORIGINS
        value: https://opti-co.vercel.app,http://localhost:3000,http://localhost:3001
